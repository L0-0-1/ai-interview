<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>模拟面试 · 面试练习室</title>
    <link rel="stylesheet" href="/workspace.css">
    <script async src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
    <script type="module" src="/interview.js"></script>
</head>
<body class="interview-page">
<header class="site-header">
    <div class="site-nav page-width">
        <a class="brand" href="/">面试练习室</a>
        <nav aria-label="主导航">
            <a href="/interview.html" aria-current="page">模拟面试</a>
            <a href="/qa.html">题库问答</a>
        </nav>
    </div>
</header>

<main class="page-width interview-main">
    <section class="setup" id="setup" aria-labelledby="setup-title">
        <div class="setup-copy">
            <h1 id="setup-title">开始一场模拟面试</h1>
            <p>告诉面试官你想投什么岗位，再贴上简历。接下来一题一题聊。</p>
        </div>
        <form class="setup-form" id="login-form">
            <label for="login-username">账号名</label>
            <input id="login-username" autocomplete="username" required>
            <label for="login-password">密码</label>
            <input id="login-password" type="password" autocomplete="current-password" required>
            <p class="error-text" id="login-error" role="alert" hidden></p>
            <button class="button button-primary" id="login-button" type="submit">登录</button>
        </form>
        <form class="setup-form" id="setup-form" hidden>
            <button class="button button-secondary history-trigger" id="history-open" type="button"
                    aria-haspopup="dialog">从已结束面试选题</button>
            <label for="target-position">目标岗位</label>
            <input id="target-position" placeholder="例如 Java 后端开发实习生" required>
            <label for="resume-text">简历内容</label>
            <textarea id="resume-text" rows="8" placeholder="粘贴你的项目经历和技能。姓名、电话等个人信息可省略。" required></textarea>
            <p class="error-text" id="setup-error" role="alert" hidden></p>
            <button class="button button-primary" id="start-button" type="button">开始面试 <span aria-hidden="true">→</span></button>
        </form>
    </section>

    <section class="room" id="room" aria-labelledby="room-title" hidden>
        <aside class="room-sidebar">
            <h1 id="room-title">模拟面试</h1>
            <p class="room-position" id="room-position"></p>
            <p class="room-progress" id="room-progress" role="status"></p>
            <button class="button button-secondary" id="end-button" type="button" hidden>结束面试</button>
            <button class="button button-secondary" id="restart-button" type="button" hidden>再练一场</button>
            <button class="button button-secondary" id="reauth-button" type="button" hidden>重新登录</button>
            <p class="error-text" id="room-error" role="alert" hidden></p>
        </aside>

        <div class="room-dialogue">
            <div class="transcript" id="transcript" tabindex="0" aria-label="面试对话">
                <ol class="messages" id="messages"></ol>
            </div>
            <form class="composer" id="composer" hidden>
                <label class="visually-hidden" for="answer-text">你的回答</label>
                <textarea id="answer-text" rows="3" maxlength="2000" placeholder="写下你的回答…" aria-describedby="answer-shortcuts"></textarea>
                <p class="error-text" id="answer-error" role="alert" hidden></p>
                <div class="composer-actions">
                    <small id="answer-shortcuts">Enter 发送 · Shift+Enter 换行</small>
                    <button class="button button-primary" id="send-button" type="button" disabled>发送回答 <span aria-hidden="true">↑</span></button>
                </div>
            </form>
        </div>
    </section>
</main>

<template id="round-review-template">
    <section class="round-review" aria-label="本轮复盘">
        <button class="button button-secondary" type="button" data-review>复盘这一轮</button>
        <p class="room-progress" role="status" data-status hidden></p>
        <p class="review-text" data-feedback tabindex="-1" hidden></p>
        <p class="review-text" data-missing hidden></p>
        <button class="button button-primary" type="button" data-practice hidden>练这道题</button>
        <p class="error-text" role="alert" data-error hidden></p>
    </section>
</template>

<dialog class="interview-dialog" id="history-dialog" aria-labelledby="history-title">
    <form method="dialog" class="dialog-heading">
        <h2 id="history-title">已结束的面试</h2>
        <button class="button button-secondary">关闭</button>
    </form>
    <p class="room-progress" id="history-status" role="status" hidden></p>
    <ul class="history-list" id="history-list"></ul>
    <p class="error-text" id="history-error" role="alert" hidden></p>
    <button class="button button-secondary" id="history-more" type="button" hidden>加载更多</button>
</dialog>

<dialog class="interview-dialog" id="practice-dialog" aria-labelledby="practice-title">
    <form method="dialog" class="dialog-heading">
        <h2 id="practice-title">专项练习</h2>
        <button class="button button-secondary">关闭</button>
    </form>
    <p class="review-text" id="practice-question"></p>
    <form id="practice-form" hidden>
        <label for="practice-answer">你的回答</label>
        <textarea id="practice-answer" rows="4" maxlength="2000" required></textarea>
        <button class="button button-primary" id="practice-submit" type="submit">提交回答</button>
    </form>
    <p class="room-progress" id="practice-status" role="status" hidden></p>
    <p class="error-text" id="practice-error" role="alert" hidden></p>
    <section id="practice-result" class="practice-result" aria-labelledby="practice-result-title" hidden>
        <h3 id="practice-result-title" tabindex="-1">作答反馈</h3>
        <p class="review-text" id="practice-feedback"></p>
        <h3>参考要点</h3>
        <p class="review-text" id="practice-scoring-points"></p>
        <a id="practice-source" target="_blank" rel="noopener" hidden>查看参考资料</a>
        <button class="button button-secondary" id="practice-explain" type="button" hidden>解释这一点</button>
        <div class="practice-explanation" id="practice-explanation" role="status" hidden></div>
    </section>
</dialog>
</body>
</html>
