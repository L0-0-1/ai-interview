<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>面试练习室</title>
    <link rel="stylesheet" href="/workspace.css">
</head>
<body>
<header class="site-header">
    <div class="site-nav page-width">
        <a class="brand" href="/">面试练习室</a>
        <nav aria-label="主导航">
            <a href="/interview.html">模拟面试</a>
            <a href="/qa.html">题库问答</a>
        </nav>
    </div>
</header>

<main class="page-width home">
    <section class="home-intro" aria-labelledby="home-title">
        <div class="hero-copy">
            <h1 id="home-title">把项目经历<br>讲给面试官听。</h1>
            <p>贴上简历，选一个想投的岗位。面试官会从你的经历出发，顺着回答往下问。</p>
            <a class="button button-primary" href="/interview.html">开始模拟面试 <span aria-hidden="true">→</span></a>
        </div>

        <section class="preview" aria-labelledby="preview-title">
            <div class="preview-header">
                <h2 id="preview-title">对话示例</h2>
                <span>Java 后端实习</span>
            </div>
            <div class="preview-dialogue">
                <div class="message message-interviewer">
                    <span class="message-speaker">面试官</span>
                    <p class="message-text">你提到项目里做了分页。同分的简历有好几条时，你怎么保证翻页的顺序稳定？</p>
                </div>
                <div class="message message-candidate">
                    <span class="message-speaker">你</span>
                    <p class="message-text">我在分数后面加了 ID 降序。同分时就按 ID 排。</p>
                </div>
                <div class="message message-interviewer">
                    <span class="message-speaker">面试官</span>
                    <p class="message-text">那如果用户翻到第二页之前，有一条新简历插到了第一页呢？</p>
                </div>
            </div>
        </section>
    </section>

    <a class="secondary-entry" href="/qa.html">
        <div>
            <h2>题库问答</h2>
            <p>复习 Java、数据库等面试知识，根据题库资料答疑。</p>
        </div>
        <span aria-hidden="true">→</span>
    </a>
</main>
</body>
</html>
