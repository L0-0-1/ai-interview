##  ============================================================
##   两份模型供应商配置，改 spring.profiles.active 一行就能整体切换
##     deepseek = DeepSeek 官方（只有 chat，没有 embedding，做不了 RAG）
##     bailian  = 阿里云百炼（OpenAI 兼容端点，chat + embedding 都有，RAG 用它）
##   切换时不需要动任何 Java 代码 —— 这就是 Spring AI 抽象层的价值
##  ============================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: myai-interview
  # 默认走 bailian（RAG 需要 embedding，只有百炼有；deepseek 官方无 embedding 接口）
  profiles:
    active: bailian

  ## ---------- 本地 MySQL 数据源（阶段1：MyBatis-Plus）----------
  ## 先执行 sql/schema.sql 建库建表，再启动应用
  datasource:
    url: jdbc:mysql://localhost:3306/ai_interview?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    # 走环境变量，不写死（配置文件要提交到 Git）
    password: ${DB_PASSWORD}

  ## ---------- Redis（阶段2：向量库）----------
  ## client-type 必须显式指定 jedis：Spring Boot 默认先创建 Lettuce 连接，
  ## 而 Spring AI 向量库自动配置点名要 Jedis 版连接，缺了它自动配置会被跳过，
  ## 启动时报「找不到 RedisVectorStore Bean」
  data:
    redis:
      host: localhost
      port: 6379
      client-type: jedis
  ai:
    vectorstore:
      redis:
        # Redis 里的向量检索需要预先建好索引（类似 MySQL 的索引）才能查询，
        initialize-schema: true

## ---------- MyBatis-Plus（阶段1）----------
mybatis-plus:
  configuration:
    # 把 Plus 生成并执行的真实 SQL 打到控制台——治「SQL 隐身」；学习期开，生产环境要去掉。
    # 用 Slf4jImpl 而不是 StdOutImpl：StdOutImpl 会绕开日志框架直接 System.out，
    # 启动时甩一行「Logging initialized using ... StdOutImpl adapter」，而且级别没法调。
    # 换成 slf4j 后由下面的 logging.level 控制，想关（生产环境）只需把 mapper 包降成 INFO。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    # 不要给整个 org.springframework.ai 开 DEBUG：启动期各种 Class.forName 可选依赖探测
    # 也会跟着打出来（例如 ToolCallingAutoConfiguration 找不到 oauth2 的
    # ClientAuthorizationException —— 项目没引 spring-security-oauth2-client，纯探测噪音）。
    # 改为：父包抬到 INFO，只对真正想看请求响应的子包开 DEBUG。
    org.springframework.ai: INFO
    org.springframework.ai.chat: DEBUG
    org.springframework.ai.openai: DEBUG
    org.springframework.ai.vectorstore: DEBUG
    # MyBatis-Plus 雪花算法会按本机网卡 IP 反推 workerId，启动时刷
    # 「Get /172.24.208.1 network interface」「Initialization Sequence datacenterId:.. workerId:..」，纯噪音
    com.baomidou.mybatisplus.core.toolkit.Sequence: WARN
    # SQL 日志改走 slf4j 后，要靠这个 logger 才看得到 Preparing / Parameters / Total
    com.study.interview.mapper: DEBUG

---
## ---------- 方案 A：DeepSeek 官方 ----------
spring:
  config:
    activate:
      on-profile: deepseek
  ai:
    openai:
      # DeepSeek 兼容 OpenAI 协议，所以直接用 OpenAI 的 starter，只改 base-url
      base-url: https://api.deepseek.com
      # Key 走环境变量
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7
      # 注意：DeepSeek 官方没有 embedding 接口，所以这个 profile 做不了 RAG 检索，
      # 只能做对话/评审。要做 RAG 请切到 bailian。

---
## ---------- 方案 B：阿里云百炼（RAG 用它）----------
spring:
  config:
    activate:
      on-profile: bailian
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        options:
          # RAG 里把「文本 → 向量」用的 embedding 模型
          model: text-embedding-v4
      chat:
        options:
          model: deepseek-v4-flash-0731
          temperature: 0.7
#rag库存入开关
interview:
  rag:
    import-javaguide: false
